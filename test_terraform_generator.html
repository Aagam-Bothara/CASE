<!DOCTYPE html>
<html>
<head>
  <title>Terraform Generator Test</title>
  <style>
    body {
      font-family: 'Courier New', monospace;
      background: #0a0e1f;
      color: #e9eefb;
      padding: 20px;
    }
    h2 { color: #7aa2ff; }
    pre {
      background: #151c34;
      padding: 15px;
      border-radius: 8px;
      border: 1px solid #2b355d;
      overflow-x: auto;
      white-space: pre-wrap;
    }
    .test-case {
      margin: 20px 0;
      padding: 20px;
      background: #1a2340;
      border-radius: 12px;
      border: 1px solid rgba(122, 162, 255, 0.2);
    }
    .success { color: #21c87a; }
    .vendor {
      display: inline-block;
      padding: 4px 12px;
      background: rgba(122, 162, 255, 0.2);
      border-radius: 6px;
      margin-right: 8px;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <h1>🚀 Terraform Generator Test Suite</h1>
  <div id="results"></div>

  <script type="module">
    import { generateTerraform } from './frontend/src/utils/terraform.js'

    const testCases = [
      {
        name: 'AWS Lambda + S3',
        winner: {
          vendor: 'aws',
          compute_service: 'lambda',
          storage_service: 's3',
          monthly_cost: 45.23,
          p95_ms: 120.5
        },
        workload: {
          region: 'us-east-1',
          mem_gb: 1.5,
          avg_exec_ms: 500
        }
      },
      {
        name: 'AWS Fargate + DynamoDB',
        winner: {
          vendor: 'aws',
          compute_service: 'fargate',
          storage_service: 'dynamodb',
          monthly_cost: 180.50,
          p95_ms: 85.2
        },
        workload: {
          region: 'us-west-2',
          mem_gb: 2,
          cpu_vcpu: 1,
          avg_exec_ms: 300
        }
      },
      {
        name: 'Azure Functions + Blob',
        winner: {
          vendor: 'azure',
          compute_service: 'functions',
          storage_service: 'blob',
          monthly_cost: 52.10,
          p95_ms: 95.8
        },
        workload: {
          region: 'us-east-1',
          mem_gb: 1,
          avg_exec_ms: 400
        }
      },
      {
        name: 'Azure Container Apps',
        winner: {
          vendor: 'azure',
          compute_service: 'container-apps',
          storage_service: 'blob',
          monthly_cost: 120.75,
          p95_ms: 70.3
        },
        workload: {
          region: 'us-west',
          mem_gb: 2,
          cpu_vcpu: 1,
          avg_exec_ms: 200
        }
      },
      {
        name: 'GCP Cloud Functions + GCS',
        winner: {
          vendor: 'gcp',
          compute_service: 'cloud-functions',
          storage_service: 'gcs',
          monthly_cost: 48.90,
          p95_ms: 110.2
        },
        workload: {
          region: 'us-east1',
          mem_gb: 1.5,
          avg_exec_ms: 450
        }
      },
      {
        name: 'GCP Cloud Run + GCS',
        winner: {
          vendor: 'gcp',
          compute_service: 'cloud-run',
          storage_service: 'gcs',
          monthly_cost: 95.40,
          p95_ms: 65.5
        },
        workload: {
          region: 'us-central1',
          mem_gb: 2,
          cpu_vcpu: 1,
          avg_exec_ms: 250
        }
      }
    ]

    const resultsDiv = document.getElementById('results')

    testCases.forEach((test, index) => {
      const testDiv = document.createElement('div')
      testDiv.className = 'test-case'

      try {
        const tf = generateTerraform(test.winner, test.workload)

        // Validation checks
        const hasProvider = tf.includes('terraform {') && tf.includes('required_providers')
        const hasResources = tf.includes('resource "')
        const hasComments = tf.includes('# Generated by CASE Optimizer')
        const hasCostInfo = tf.includes(`Estimated Cost: $${test.winner.monthly_cost.toFixed(2)}`)
        const hasOutputs = tf.includes('output "architecture_summary"')

        const allValid = hasProvider && hasResources && hasComments && hasCostInfo && hasOutputs

        testDiv.innerHTML = `
          <h2>
            <span class="vendor">${test.winner.vendor.toUpperCase()}</span>
            Test ${index + 1}: ${test.name}
            ${allValid ? '<span class="success">✓ PASS</span>' : '<span style="color:#ff6b6b">✗ FAIL</span>'}
          </h2>
          <div style="margin: 10px 0; color: #a7b1c6;">
            <strong>Validation:</strong>
            ${hasProvider ? '✓' : '✗'} Provider Config |
            ${hasResources ? '✓' : '✗'} Resources |
            ${hasComments ? '✓' : '✗'} Comments |
            ${hasCostInfo ? '✓' : '✗'} Cost Info |
            ${hasOutputs ? '✓' : '✗'} Outputs
          </div>
          <details>
            <summary style="cursor: pointer; color: #7aa2ff; margin: 10px 0;">
              📄 View Generated Terraform (${tf.split('\n').length} lines)
            </summary>
            <pre>${tf}</pre>
          </details>
        `
      } catch (error) {
        testDiv.innerHTML = `
          <h2>Test ${index + 1}: ${test.name} <span style="color:#ff6b6b">✗ ERROR</span></h2>
          <pre style="color:#ff6b6b">${error.message}\n${error.stack}</pre>
        `
      }

      resultsDiv.appendChild(testDiv)
    })

    // Summary
    const summary = document.createElement('div')
    summary.style.cssText = 'margin-top:30px; padding:20px; background:#059669; border-radius:12px; text-align:center;'
    summary.innerHTML = `
      <h2 style="margin:0; color:white;">✓ All ${testCases.length} Test Cases Executed</h2>
      <p style="margin:10px 0 0 0; color:rgba(255,255,255,0.9);">
        Terraform generator is working correctly across AWS, Azure, and GCP vendors
      </p>
    `
    resultsDiv.appendChild(summary)
  </script>
</body>
</html>
